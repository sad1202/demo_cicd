name: Full Demo Deployment vs Delivery

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ================= VẾ CI: TEST TỰ ĐỘNG =================
  continuous-integration:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4
    - name: Cài đặt Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Chạy tự động các bài Test
      run: node test.js

  # ================= VẾ CD 1: CONTINUOUS DEPLOYMENT (Tự động lên thẳng bản chính thức) =================
  continuous-deployment-production:
    needs: continuous-integration
    runs-on: ubuntu-latest
    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Tạo file đánh dấu môi trường Production
      run: |
        echo "<script>window.ENV_NAME='PRODUCTION'; window.ENV_COLOR='#2c3e50';</script>" > env-config.js

    - name: Deploy lên Production Web (Nhánh gh-pages gốc)
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: '.' # Đẩy toàn bộ code hiện tại lên gốc trang web
        branch: gh-pages

  # ================= VẾ CD 2: CONTINUOUS DELIVERY (Phải bấm duyệt mới lên bản thử nghiệm) =================
  continuous-delivery-staging:
    needs: continuous-integration
    runs-on: ubuntu-latest
    environment:
      name: staging-delivery # CHỐT CHẶN BẤM NÚT TRÊN GITHUB
    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Tạo file đánh dấu môi trường Staging
      run: |
        echo "<script>window.ENV_NAME='STAGING (DELIVERY)'; window.ENV_COLOR='#e67e22';</script>" > env-config.js

    - name: Deploy lên Staging Web (Nằm trong thư mục /staging)
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: '.'
        branch: gh-pages
        target-folder: staging # Ép code này chui vào thư mục /staging trên web